<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国心解读 · H5 产品原型</title>
<style>
/* ===== 全局变量 & 重置 ===== */
:root {
  --bg: #FAF6EF;
  --card: #FFFDF7;
  --gold: #C9A84C;
  --gold-light: #F0E0A0;
  --gold-bg: #FDF5DC;
  --green: #3A6B4A;
  --green-light: #EAF3ED;
  --brown: #7A5C3A;
  --brown-light: #F5EDE0;
  --teal: #4A8080;
  --teal-light: #E5F2F2;
  --text: #2C2010;
  --text-sub: #7A6B55;
  --text-hint: #B0A080;
  --border: #E8D9C0;
  --shadow: rgba(100,70,20,0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:#D8CFC0; font-family:var(--font); min-height:100vh; }

/* ===== 设备壳 ===== */
.device-shell {
  display:none;
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#D8CFC0;
  align-items:center; justify-content:center;
}
@media (min-width:600px) {
  .device-shell { display:flex; }
  body { overflow:hidden; }
}
.phone-wrap {
  width:390px; height:844px;
  background:#fff;
  border-radius:50px;
  box-shadow:0 30px 80px rgba(0,0,0,0.4), 0 0 0 2px #888;
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column;
}
.phone-notch {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:126px; height:34px;
  background:#111;
  border-radius:0 0 20px 20px;
  z-index:100;
}

/* ===== 移动端全屏 ===== */
.mobile-root {
  width:100%; height:100%;
  background:var(--bg);
  overflow:hidden;
  display:flex; flex-direction:column;
  position:relative;
}
@media (max-width:599px) {
  .mobile-root {
    position:fixed; top:0; left:0;
    width:100vw; height:100vh;
  }
}

/* ===== 状态栏 ===== */
.status-bar {
  height:44px; min-height:44px;
  background:var(--bg);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  font-size:13px; color:var(--text);
  font-weight:600;
  flex-shrink:0;
}
.status-bar .time { font-size:15px; font-weight:700; }
.status-icons { display:flex; gap:6px; align-items:center; }
.status-icons svg { width:16px; height:16px; fill:var(--text); }

/* ===== 页面容器 ===== */
.screen {
  display:none;
  flex:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--bg);
  flex-direction:column;
}
.screen.active { display:flex; }

/* ===== 导航栏 ===== */
.nav-bar {
  height:56px; min-height:56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-bar .nav-title {
  font-size:18px; font-weight:700; color:var(--text);
  letter-spacing:0.03em;
}
.nav-back {
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:var(--brown-light);
  cursor:pointer; border:none;
  font-size:18px;
}
.nav-action {
  font-size:15px; color:var(--green); font-weight:600;
  background:none; border:none; cursor:pointer;
  padding:6px 10px;
}

/* ===== 通用卡片 ===== */
.card {
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:0 2px 12px var(--shadow);
  padding:20px;
  margin:0 16px 14px;
}
.card-sm { padding:14px 16px; border-radius:var(--radius-sm); }

/* ===== 按钮 ===== */
.btn {
  display:flex; align-items:center; justify-content:center;
  width:100%; min-height:56px;
  border-radius:14px;
  font-size:18px; font-weight:700;
  border:none; cursor:pointer;
  letter-spacing:0.04em;
  transition:opacity .15s;
}
.btn:active { opacity:.8; }
.btn-primary {
  background:linear-gradient(135deg, #C9A84C, #A07830);
  color:#fff;
  box-shadow:0 4px 18px rgba(160,100,30,0.35);
}
.btn-secondary {
  background:var(--green-light);
  color:var(--green);
  border:1.5px solid var(--green);
}
.btn-outline {
  background:transparent;
  color:var(--brown);
  border:1.5px solid var(--border);
}
.btn-sm {
  min-height:44px; font-size:15px; font-weight:600;
  border-radius:10px;
}
.btn-danger {
  background:#FFF0F0; color:#C04040; border:1.5px solid #F0C0C0;
}
.btn-group { padding:0 16px; display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
.btn-row { display:flex; gap:10px; }
.btn-row .btn { flex:1; }

/* ===== 徽章/标签 ===== */
.badge {
  display:inline-flex; align-items:center; justify-content:center;
  padding:3px 10px; border-radius:20px;
  font-size:12px; font-weight:600;
}
.badge-gold { background:var(--gold-bg); color:var(--gold); border:1px solid var(--gold-light); }
.badge-green { background:var(--green-light); color:var(--green); }
.badge-teal { background:var(--teal-light); color:var(--teal); }
.badge-brown { background:var(--brown-light); color:var(--brown); }

/* ===== 分割线 ===== */
.divider { height:1px; background:var(--border); margin:14px 0; }
.section-gap { height:10px; background:var(--border); opacity:.4; margin:6px 0; }

/* ===== 文字工具 ===== */
.text-lg { font-size:20px; font-weight:700; color:var(--text); }
.text-md { font-size:17px; font-weight:600; color:var(--text); }
.text-sm { font-size:14px; color:var(--text-sub); line-height:1.6; }
.text-xs { font-size:12px; color:var(--text-hint); }
.text-gold { color:var(--gold); }
.text-green { color:var(--green); }
.text-center { text-align:center; }
.mb4 { margin-bottom:4px; }
.mb8 { margin-bottom:8px; }
.mb12 { margin-bottom:12px; }
.mb16 { margin-bottom:16px; }
.mt8 { margin-top:8px; }
.mt12 { margin-top:12px; }
.mt16 { margin-top:16px; }
.px16 { padding:0 16px; }
.pb24 { padding-bottom:24px; }
.flex { display:flex; }
.flex-center { display:flex; align-items:center; justify-content:center; }
.flex-between { display:flex; align-items:center; justify-content:space-between; }
.flex-col { flex-direction:column; }
.gap8 { gap:8px; }
.gap12 { gap:12px; }

/* ===== 导航点 ===== */
.page-dots {
  display:flex; justify-content:center; gap:8px;
  padding:10px 0;
  flex-shrink:0;
}
.page-dots span {
  width:8px; height:8px; border-radius:50%;
  background:var(--border); cursor:pointer;
  transition:background .2s, transform .2s;
}
.page-dots span.active { background:var(--gold); transform:scale(1.3); }

/* ===== 底部安全区 ===== */
.safe-area { height:34px; flex-shrink:0; }

/* ===== 装饰线条 ===== */
.deco-line {
  display:flex; align-items:center; gap:8px;
  color:var(--gold); font-size:12px;
}
.deco-line::before, .deco-line::after {
  content:''; flex:1; height:1px; background:var(--gold-light);
}

/* ===== 进度步骤 ===== */
.step-list { padding:0 16px; }
.step-item {
  display:flex; gap:14px; align-items:flex-start;
  padding-bottom:20px;
  position:relative;
}
.step-item:not(:last-child)::before {
  content:''; position:absolute;
  left:16px; top:32px; bottom:0; width:2px;
  background:var(--border);
}
.step-dot {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700;
  flex-shrink:0;
  position:relative; z-index:1;
}
.step-done { background:var(--green); color:#fff; }
.step-active { background:var(--gold); color:#fff; animation:pulse 1.8s infinite; }
.step-pending { background:var(--border); color:var(--text-hint); }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.5)} 50%{box-shadow:0 0 0 8px rgba(201,168,76,0)} }

/* ===== 表单 ===== */
.form-group { padding:0 16px 14px; }
.form-label { font-size:15px; font-weight:600; color:var(--text-sub); margin-bottom:8px; display:block; }
.form-input {
  width:100%; min-height:52px; padding:12px 16px;
  background:var(--card); border:1.5px solid var(--border);
  border-radius:12px; font-size:17px; color:var(--text);
  outline:none; font-family:var(--font);
}
.form-input:focus { border-color:var(--gold); }
.picker-row {
  display:flex; gap:10px; flex-wrap:wrap;
}
.picker-chip {
  flex:1; min-width:80px; max-width:160px;
  min-height:52px;
  background:var(--card); border:1.5px solid var(--border);
  border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--text); cursor:pointer;
  transition:all .15s; font-weight:500;
}
.picker-chip.selected {
  background:var(--gold-bg); border-color:var(--gold); color:var(--brown);
  font-weight:700;
}
.picker-chip:active { opacity:.8; }

/* ===== 聊天气泡 ===== */
.chat-bubble {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:4px 16px 16px 16px;
  padding:14px 16px;
  font-size:16px; line-height:1.7; color:var(--text);
  position:relative;
  max-width:90%;
}
.chat-avatar {
  width:42px; height:42px; border-radius:50%;
  background:linear-gradient(135deg, var(--green), var(--teal));
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
  box-shadow:0 2px 8px rgba(58,107,74,0.3);
}

/* ===== 选项卡组 ===== */
.option-grid {
  display:grid; grid-template-columns:repeat(2, 1fr);
  gap:10px; padding:0 16px;
}
.option-chip {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:12px; padding:14px 12px;
  text-align:center; font-size:16px; color:var(--text);
  cursor:pointer; transition:all .15s; font-weight:500;
}
.option-chip.selected {
  background:var(--green-light); border-color:var(--green); color:var(--green);
  font-weight:700;
}
.option-chip:active { opacity:.8; }

/* ===== 商品卡片 ===== */
.goods-card {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:var(--radius); margin:0 16px 12px;
  overflow:hidden; cursor:pointer; transition:all .15s;
}
.goods-card.hot {
  border-color:var(--gold);
  box-shadow:0 4px 20px rgba(201,168,76,0.2);
}
.goods-head {
  background:linear-gradient(135deg, #C9A84C, #A07830);
  padding:10px 16px;
  display:flex; align-items:center; justify-content:space-between;
  color:#fff;
}
.goods-head-plain { background:var(--brown-light); }
.goods-head-plain .goods-name { color:var(--brown); }
.goods-head-plain .goods-tag { background:var(--brown); }
.goods-name { font-size:17px; font-weight:700; }
.goods-tag {
  background:rgba(255,255,255,0.3); border-radius:10px;
  padding:2px 8px; font-size:12px;
}
.goods-body { padding:14px 16px; }
.goods-price { font-size:30px; font-weight:800; color:var(--brown); }
.goods-price span { font-size:17px; }
.goods-origin { font-size:14px; color:var(--text-hint); text-decoration:line-through; margin-left:8px; }
.goods-info { font-size:14px; color:var(--text-sub); line-height:1.8; margin-top:6px; }
.goods-tip { font-size:13px; color:var(--green); margin-top:8px; font-weight:600; }
.goods-card.selected { border-color:var(--gold); }
.goods-select-dot {
  width:22px; height:22px; border-radius:50%;
  border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:12px;
}
.goods-select-dot.on { border-color:var(--gold); background:var(--gold); color:#fff; }

/* ===== 解读记录条 ===== */
.record-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius-sm); margin:0 16px 12px;
  padding:16px;
}
.record-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
.record-meta { font-size:13px; color:var(--text-sub); display:flex; gap:12px; flex-wrap:wrap; }

/* ===== 档案卡片 ===== */
.profile-card {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:var(--radius); margin:0 16px 14px;
  padding:18px 16px;
  position:relative; overflow:hidden;
}
.profile-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--gold), var(--green));
}
.profile-card-name { font-size:20px; font-weight:800; color:var(--text); margin-bottom:4px; }
.profile-card-meta { font-size:14px; color:var(--text-sub); line-height:1.8; }
.profile-card-stats {
  display:flex; gap:20px; margin-top:12px; padding-top:12px;
  border-top:1px solid var(--border);
}
.stat-item { text-align:center; flex:1; }
.stat-num { font-size:22px; font-weight:800; color:var(--brown); }
.stat-label { font-size:12px; color:var(--text-hint); margin-top:2px; }

/* ===== 首页横幅 ===== */
.hero-banner {
  background:linear-gradient(160deg, #3A6B4A 0%, #2C5040 40%, #1E3A30 100%);
  padding:32px 24px 28px;
  text-align:center;
  position:relative; overflow:hidden;
}
.hero-banner::before {
  content:''; position:absolute;
  top:-30px; right:-30px; width:180px; height:180px;
  background:radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
  border-radius:50%;
}
.hero-banner::after {
  content:''; position:absolute;
  bottom:-40px; left:-20px; width:140px; height:140px;
  background:radial-gradient(circle, rgba(201,168,76,0.10) 0%, transparent 70%);
  border-radius:50%;
}
.hero-logo {
  font-size:36px; font-weight:900; color:#fff;
  letter-spacing:0.08em; margin-bottom:4px;
  position:relative; z-index:1;
}
.hero-logo em {
  display:inline-block; width:3px; height:32px;
  background:var(--gold); border-radius:2px;
  margin:0 4px; vertical-align:middle; font-style:normal;
}
.hero-subtitle { font-size:14px; color:rgba(255,255,255,0.7); margin-bottom:20px; position:relative; z-index:1; }
.hero-avatar {
  width:88px; height:88px; border-radius:50%;
  background:linear-gradient(135deg, #5A9B7A, #3A6B4A);
  border:3px solid rgba(201,168,76,0.5);
  display:flex; align-items:center; justify-content:center;
  font-size:36px; margin:0 auto 12px;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
  position:relative; z-index:1;
}
.hero-teacher { font-size:17px; font-weight:700; color:#fff; margin-bottom:4px; position:relative; z-index:1; }
.hero-desc { font-size:14px; color:rgba(255,255,255,0.75); line-height:1.7; position:relative; z-index:1; }
.quota-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
  border-radius:20px; padding:6px 16px;
  color:#fff; font-size:14px; margin-top:14px;
  position:relative; z-index:1;
}
.quota-num { font-size:20px; font-weight:800; color:var(--gold-light); }

/* ===== 解读详情内容 ===== */
.detail-section { padding:0 16px 14px; }
.detail-section-title {
  font-size:17px; font-weight:800; color:var(--green);
  padding:8px 12px; background:var(--green-light);
  border-left:4px solid var(--green); border-radius:0 8px 8px 0;
  margin-bottom:10px;
}
.detail-para {
  font-size:16px; color:var(--text); line-height:1.85;
  margin-bottom:8px;
}
.detail-tips {
  background:var(--gold-bg); border:1px solid var(--gold-light);
  border-radius:10px; padding:14px 16px;
  font-size:15px; color:var(--brown); line-height:1.75;
}

/* ===== 进度动画 ===== */
.typing-dots {
  display:inline-flex; gap:4px; align-items:center;
  padding:4px 0;
}
.typing-dots span {
  width:8px; height:8px; border-radius:50%;
  background:var(--gold);
  animation:blink 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay:.2s; }
.typing-dots span:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

/* ===== 空状态 ===== */
.empty-state {
  text-align:center; padding:48px 32px;
  color:var(--text-sub);
}
.empty-icon { font-size:52px; margin-bottom:14px; }
.empty-text { font-size:16px; line-height:1.7; }

/* ===== 底部声明 ===== */
.disclaimer {
  margin:0 16px 14px;
  background:var(--brown-light); border-radius:10px;
  padding:12px 14px;
  font-size:12px; color:var(--text-hint); line-height:1.7;
}

/* ===== 确认信息行 ===== */
.info-row {
  display:flex; align-items:flex-start;
  padding:10px 0; border-bottom:1px solid var(--border);
}
.info-row:last-child { border-bottom:none; }
.info-label { font-size:15px; color:var(--text-sub); min-width:80px; flex-shrink:0; }
.info-value { font-size:15px; color:var(--text); font-weight:600; flex:1; }

/* ===== 页面切换导航（桌面端原型专用）===== */
.proto-nav {
  display:none;
}
@media (min-width:600px) {
  .proto-nav {
    display:flex;
    position:fixed; bottom:20px; left:50%;
    transform:translateX(-50%);
    background:rgba(44,32,16,0.88);
    backdrop-filter:blur(12px);
    border-radius:32px;
    padding:8px 16px; gap:6px;
    z-index:9999;
    flex-wrap:wrap;
    max-width:600px;
  }
  .proto-nav button {
    padding:6px 12px; border-radius:20px;
    background:transparent; border:1px solid rgba(255,255,255,0.2);
    color:rgba(255,255,255,0.7); font-size:12px; cursor:pointer;
    transition:all .15s; white-space:nowrap;
  }
  .proto-nav button:hover { background:rgba(201,168,76,0.3); color:#fff; }
  .proto-nav button.cur { background:var(--gold); color:#fff; border-color:var(--gold); }
}
</style>
</head>
<body>

<!-- 桌面端设备壳 -->
<div class="device-shell">
  <div class="phone-wrap">
    <div class="phone-notch"></div>
    <div class="mobile-root" id="app">
      <!-- 状态栏 -->
      <div class="status-bar" id="statusBar">
        <span class="time">10:06</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>
      <!-- 所有页面在此渲染 -->
      <div id="screens" style="flex:1;overflow:hidden;display:flex;flex-direction:column;"></div>
    </div>
  </div>
</div>

<!-- 移动端直接全屏 -->
<div class="mobile-root" id="app-mobile" style="display:none;">
  <div class="status-bar">
    <span class="time">10:06</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#2C2010"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#2C2010"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>
  <div id="screens-mobile" style="flex:1;overflow:hidden;display:flex;flex-direction:column;"></div>
</div>

<!-- 原型导航 -->
<div class="proto-nav" id="protoNav"></div>

<script>
// ===== 页面数据 =====
const pages = [
  { id:'p1', title:'① 首页' },

// ===== HTML 模板 =====
function renderPage(id) {
  switch(id) {
    case 'p1': return pageHome();
    case 'p2': return pageProfileList();
    case 'p3': return pageCreateProfile();
    case 'p4': return pageChatGuide();
    case 'p5': return pageProcessing();
    case 'p6': return pageComplete();
    case 'p7': return pageDetail();
    case 'p8': return pageRecords();
    case 'p9': return pageRecharge();
    default: return '<div style="padding:40px;text-align:center;color:#999">页面不存在</div>';
  }
}

// ===== 交互逻辑 =====
let currentPage = 'p1';

function selectChip(el, group) {
  const parent = el.parentElement;
  parent.querySelectorAll('.picker-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}
function toggleOpt(el) {
  el.classList.toggle('selected');
}
function selectGoods(card) {
  document.querySelectorAll('.goods-card').forEach(c => {
    c.querySelector('.goods-select-dot').classList.remove('on');
    c.querySelector('.goods-select-dot').textContent = '';
  });
  const dot = card.querySelector('.goods-select-dot');
  dot.classList.add('on');
  dot.textContent = '✓';
}

function goto(pageId) {
  currentPage = pageId;
  // 找到两个容器并更新
  ['screens', 'screens-mobile'].forEach(containerId => {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = renderPage(pageId);
  });
  // 更新导航按钮状态
  document.querySelectorAll('.proto-nav button').forEach(btn => {
    btn.classList.toggle('cur', btn.dataset.page === pageId);
  });
  // 滚动回顶部
  setTimeout(() => {
    document.querySelectorAll('.screen.active').forEach(s => s.scrollTop = 0);
  }, 50);
}

// ===== 初始化 =====
function init() {
  const isMobile = window.innerWidth < 600;
  if (isMobile) {
    document.getElementById('app-mobile').style.display = 'flex';
  }

  // 构建原型导航
  const nav = document.getElementById('protoNav');
  pages.forEach(p => {
    const btn = document.createElement('button');
    btn.textContent = p.title;
    btn.dataset.page = p.id;
    if (p.id === currentPage) btn.classList.add('cur');
    btn.onclick = () => goto(p.id);
    nav.appendChild(btn);
  });

  // 首次渲染
  goto('p1');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
